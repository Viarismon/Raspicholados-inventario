# Módulo: Inventario (versión web con framework)
# Propósito: Configuración de la aplicación Spring Boot: puerto,
#            conexión a la base de datos y comportamiento de JPA.
# Autora: Viviana Arias Montilla
# Fecha de creación: 2026-09-02

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/raspicholados_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false
