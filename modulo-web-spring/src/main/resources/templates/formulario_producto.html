<!--
  Módulo: Inventario (versión web con framework)
  Propósito: Vista Thymeleaf del formulario para registrar o editar
             un producto. th:object y th:field enlazan directamente
             los campos del formulario con el objeto Producto,
             reemplazando el llenado manual con jsp:getProperty de
             la evidencia EV02.
  Autora: Viviana Arias Montilla
  Fecha de creación: 2026-09-02
-->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RASPICHOLADOS - Formulario de producto</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>

<header>
    <h1>RASPICHOLADOS</h1>
    <p>Módulo de inventario (web con Spring Boot)</p>
</header>

<main>
    <h2 th:text="${esEdicion} ? 'Editar producto' : 'Registrar nuevo producto'">Formulario</h2>

    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">

        <input type="hidden" th:field="*{idProducto}">

        <label for="nombreProducto">Nombre del producto</label>
        <input type="text" id="nombreProducto" th:field="*{nombreProducto}" required>

        <label for="categoria">Categoría</label>
        <input type="text" id="categoria" th:field="*{categoria}" required>

        <label for="unidadMedida">Unidad de medida</label>
        <input type="text" id="unidadMedida" th:field="*{unidadMedida}" required>

        <label for="stockActual">Stock actual</label>
        <input type="number" id="stockActual" th:field="*{stockActual}" min="0" required>

        <label for="stockMinimo">Stock mínimo</label>
        <input type="number" id="stockMinimo" th:field="*{stockMinimo}" min="0" required>

        <div class="acciones-formulario">
            <button type="submit" class="boton"
                    th:text="${esEdicion} ? 'Guardar cambios' : 'Registrar producto'">Guardar</button>
            <a class="boton boton-secundario" th:href="@{/productos}">Cancelar</a>
        </div>
    </form>
</main>

</body>
</html>
