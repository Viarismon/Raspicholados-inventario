<!--
  Módulo: Inventario (versión web con framework)
  Propósito: Vista Thymeleaf que lista los productos del inventario.
             th:each recorre la lista sin necesidad de scriptlets, a
             diferencia de la versión JSP de la evidencia EV02.
  Autora: Viviana Arias Montilla
  Fecha de creación: 2026-09-02
-->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RASPICHOLADOS - Inventario</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>

<header>
    <h1>RASPICHOLADOS</h1>
    <p>Módulo de inventario (web con Spring Boot)</p>
</header>

<main>
    <div class="barra-acciones">
        <a class="boton" th:href="@{/productos/nuevo}">+ Nuevo producto</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Unidad</th>
            <th>Stock actual</th>
            <th>Stock mínimo</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="producto : ${listaProductos}"
            th:class="${producto.tieneStockBajo} ? 'fila-alerta' : ''">
            <td th:text="${producto.idProducto}">1</td>
            <td th:text="${producto.nombreProducto}">Nombre</td>
            <td th:text="${producto.categoria}">Categoría</td>
            <td th:text="${producto.unidadMedida}">Unidad</td>
            <td th:text="${producto.stockActual}">0</td>
            <td th:text="${producto.stockMinimo}">0</td>
            <td th:text="${producto.tieneStockBajo} ? 'Stock bajo' : 'Normal'">Estado</td>
            <td>
                <a th:href="@{/productos/editar/{id}(id=${producto.idProducto})}">Editar</a>
                &nbsp;|&nbsp;
                <a th:href="@{/productos/eliminar/{id}(id=${producto.idProducto})}"
                   onclick="return confirm('¿Eliminar este producto del inventario?');">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaProductos)}">
            <td colspan="8">No hay productos registrados todavía.</td>
        </tr>
        </tbody>
    </table>

    <p class="pie-tabla" th:text="'Total de productos listados: ' + ${listaProductos.size()}">
        Total de productos listados: 0
    </p>
</main>

</body>
</html>
