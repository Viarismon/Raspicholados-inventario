# ==============================================================
#  Configuración de la API de inventario Raspicholados
#  (no subir a GitHub con contraseñas reales; ver config.ejemplo.properties)
# ==============================================================

# Puerto HTTP del servicio
servidor.puerto=8080

# Persistencia: "mysql" (base de datos real) o "memoria" (demostración)
persistencia.modo=mysql
# Si MySQL no responde, ¿continuar en memoria? (true/false)
persistencia.respaldo.memoria=true

# Conexión a MySQL (XAMPP/Workbench). Ejecute antes sql/raspicholados_api_v2.sql
bd.url=jdbc:mysql://localhost:3306/raspicholados_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
bd.usuario=root
bd.contrasena=

# Secreto para firmar los tokens JWT (mínimo 32 caracteres) y vigencia en minutos
jwt.secreto=CAMBIAR-este-secreto-de-Raspicholados-por-uno-propio-2026
jwt.minutos.vigencia=120

# Administrador que se crea solo si la tabla usuario está vacía
admin.usuario=admin
admin.contrasena.inicial=Raspi2026*
